name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste API keys, secrets or account identifiers.** Redact them.
        If a credential was exposed, rotate it at the exchange first.

        For a security vulnerability, do not use this form — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set QF_... to ...
        2. Run `make ...`
        3. Observe ...
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Trading mode
      options: [backtest, paper, demo, live, not applicable]
    validations: { required: true }
  - type: dropdown
    id: env
    attributes:
      label: Exchange environment
      options: [demo, testnet, mainnet, none / no venue]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or a commit SHA
    validations: { required: true }
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.8"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.5 / Ubuntu 24.04"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Redact keys, account ids and balances.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have redacted all credentials and account identifiers.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true
        - label: I have run `make check` on an unmodified checkout.
