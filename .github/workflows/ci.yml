name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Never let a CI run touch a real venue.
  QF_ENV: test
  QF_EXCHANGE__TESTNET: "true"
  QF_TRADING__MODE: backtest

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev,ai]"

      - name: Ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: Black
        run: .venv/bin/black --check .

      - name: Mypy (strict)
        run: .venv/bin/mypy

      - name: Unit tests with coverage
        run: |
          .venv/bin/pytest -m "not integration and not network" \
            --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantflow
          POSTGRES_PASSWORD: quantflow
          POSTGRES_DB: quantflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quantflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QF_DATABASE__HOST: localhost
      QF_DATABASE__NAME: quantflow_test
      QF_REDIS__HOST: localhost
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install project
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev,ai]"

      - name: Migrate
        run: .venv/bin/alembic upgrade head

      - name: Integration tests
        run: .venv/bin/pytest -m integration

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run build
      - run: npm run test --if-present

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: quantflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: docker run --rm quantflow:ci python -c "import quantflow; print(quantflow.__version__)"
